<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>担任救出ARジェットコースター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    
    /* カメラ映像 */
    #camera-feed {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
    }
    
    /* UIオーバーレイ */
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
      pointer-events: none;
    }
    
    /* ヘッダー・スコア表示 */
    .hud-header {
      display: flex; justify-content: space-between; color: #00ffcc;
      font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #00ffcc;
    }
    
    /* 画面中央の照準 */
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80px; height: 80px; border: 2px solid rgba(0, 255, 204, 0.6); border-radius: 50%;
      pointer-events: none;
    }
    .crosshair::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 10px; height: 10px; background: #ff0055; border-radius: 50%;
    }

    /* 撃破エフェクト用キャンバス */
    #fx-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none;
    }

    /* リザルト・ランキング画面 */
    #result-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
      background: rgba(0, 0, 0, 0.9); color: #fff; display: none;
      flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .btn {
      background: #00ffcc; color: #000; border: none; padding: 12px 24px;
      font-size: 18px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- カメラバックグラウンド -->
  <video id="camera-feed" autoplay playsinline muted></video>
  
  <!-- エフェクト描画用 -->
  <canvas id="fx-canvas"></canvas>

  <!-- HUD・ゲームUI -->
  <div id="ui-layer">
    <div class="hud-header">
      <div>SCORE: <span id="score-val">0</span></div>
      <div>MISSION: 担任を救出せよ</div>
    </div>
    <div class="crosshair"></div>
  </div>

  <!-- リザルト画面 -->
  <div id="result-modal">
    <h1>MISSION COMPLETE!</h1>
    <p style="margin: 15px 0; font-size: 24px;">FINAL SCORE: <span id="final-score">0</span> PT</p>
    
    <h3>🏆 今日のトップランキング</h3>
    <ol id="ranking-list" style="margin: 15px 0; text-align: left;"></ol>

    <button class="btn" onclick="location.reload()">もう一度プレイ</button>
  </div>

  <script>
    let score = 0;
    const scoreVal = document.getElementById('score-val');
    const fxCanvas = document.getElementById('fx-canvas');
    const ctx = fxCanvas.getContext('2d');

    // キャンバスリサイズ
    function resizeCanvas() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 1. カメラ起動処理
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        document.getElementById('camera-feed').srcObject = stream;
      } catch (err) {
        alert('カメラの起動に失敗しました。アクセス権限を確認してください。');
      }
    }
    initCamera();

    // 2. Web Audio API による効果音生成（外部ファイル不要）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playLaserSE() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // 3. 全画面タップ（物理トリガー対応）による射撃・ヒット判定
    window.addEventListener('pointerdown', (e) => {
      // リザルト画面表示中は反応しない
      if (document.getElementById('result-modal').style.display === 'flex') return;

      playLaserSE();
      createMuzzleFlash(e.clientX, e.clientY);

      // ※本来はここでMindAR等のターゲット位置判定を行います
      // プロトタイプとして一定確率/照準中央付近でのHITをシミュレーション
      score += 100;
      scoreVal.textContent = score;
    });

    // 発射エフェクト描画
    function createMuzzleFlash(x, y) {
      ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      ctx.beginPath();
      ctx.arc(x, y, 40, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 255, 204, 0.8)';
      ctx.fill();
      setTimeout(() => ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height), 100);
    }

    // 4. ゲーム終了・ランキング表示処理（コースター到着時など）
    function finishGame() {
      document.getElementById('result-modal').style.display = 'flex';
      document.getElementById('final-score').textContent = score;
      
      // ダミーのランキングデータ表示（本番はFirebase等から取得）
      const dummyRanking = [
        { name: "タナカ", score: 1200 },
        { name: "ヤマダ", score: 900 },
        { name: "サトウ", score: 700 }
      ];
      
      const listEl = document.getElementById('ranking-list');
      listEl.innerHTML = dummyRanking
        .map(item => `<li>${item.name}: ${item.score} PT</li>`)
        .join('');
    }

    // デモ用：30秒後に自動でゲーム終了（コースターの平均走行時間に合わせる）
    // setTimeout(finishGame, 30000);
  </script>
</body>
</html>
